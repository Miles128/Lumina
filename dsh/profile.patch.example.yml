# Lumina profile override template
#
# Copy the relevant rows into $DSH_HOME/profiles/<name>/cordis.patch.yml.
# The user layer replaces a row's whole `config`, so keep each block complete.

# --- Product layer -----------------------------------------------------------
- id: lumina
  config:
    memory:
      enabled: true
      root: ~/.lumina/memories
      inject: true
      maxChars: 4000
    shibei:
      recall: true
      serverName: shibei
      autoRecall: false
      topK: 3
      maxChars: 1200
      timeoutMs: 8000

# --- Skills (dsh native) -----------------------------------------------------
# Discovered roots: <project>/.dsh/skills, <project>/.agents/skills,
# customSkillDirs, ~/.dsh/skills, ~/.agents/skills.
- id: skill-filesystem
  disabled: false
  config:
    customSkillDirs:
      - /Users/me/.lumina/skills   # absolute: dsh does not expand `~` here
- id: tool-skill
  disabled: false

# --- Workflow scripts (JS orchestration over subagents) ----------------------
- id: workflow-ptc
  disabled: false
  config:
    provider: spawn
- id: tool-workflow
  disabled: false

# --- Shibei knowledge base over MCP -----------------------------------------
# Replace the paths with your checkout. `serverName` must match
# `lumina.shibei.serverName`.
- insert:
    - id: mcp-shibei
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: shibei
        transport: stdio
        command: /Users/me/Documents/My Projects/shibei/.venv/bin/python
        args:
          - -m
          - shibei.server
        env:
          PYTHONPATH: /Users/me/Documents/My Projects/shibei/src
          SHIBEI_CONFIG: /Users/me/Documents/My Projects/shibei/config.yaml
        toolCallTimeoutMs: 120000
        failOnStartupError: false
