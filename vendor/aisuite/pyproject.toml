[project]
name = "aisuite"
version = "0.1.14+lumina"
description = "Lumina-vendored fork of aisuite (uniform LLM + Agents API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.10.0",
    "docstring-parser>=0.16,<1.0",
    "openai>=1.107.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.1.2", "nest-asyncio>=1.6.0"]
all = ["mcp>=1.1.2", "nest-asyncio>=1.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisuite"]
