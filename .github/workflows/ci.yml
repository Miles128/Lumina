name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

jobs:
  dsh-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dsh/package-lock.json

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
